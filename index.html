const app=document.getElementById('app');let page='home',activeModel={};let worker=new Worker('./betru-worker.js');let job=0;const state=JSON.parse(localStorage.getItem('betru-state-v10')||'{}');
function save(){localStorage.setItem('betru-state-v10',JSON.stringify(state))}function go(p){page=p;render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})}function pct(n){return (n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}
function header(title){return `<div class="bar"><button class="navbtn back" onclick="go('home')">‹</button><h2>${esc(title)}</h2></div>`}
function home(){return `<div class="page-title">Choisir un type de calcul</div><div class="note">Chaque bouton ouvre une page dédiée. Les paramètres de chaque modèle sont conservés séparément sur cet appareil.</div><div class="home-actions">${CONFIG.pages.map((p,i)=>`<button class="home-btn" onclick="go('${p.id}')"><span class="ico">${['🏆','⚽','🚩','◐','🟨','🎯','🧤','⚽'][i]}</span><span><b>${esc(p.title)}</b><small>${p.models.length} modèle${p.models.length>1?'s':''}</small></span><span class="chev">›</span></button>`).join('')}<button class="home-btn home-reset" onclick="resetAll()"><span class="ico">↺</span><span><b>Réinitialiser toutes les fenêtres</b><small>Restaurer tous les paramètres par défaut</small></span></button></div>`}
function pageView(p){const idx=activeModel[p.id]??0;const m=p.models[idx];return header(p.title)+`<div class="tabs">${p.models.map((m,i)=>`<button class="tab ${i===idx?'active':''}" onclick="setModel('${p.id}',${i})">Modèle ${m.n}</button>`).join('')}</div><div id="model"></div>`}
function getDefaults(m){const vals=Object.values(m.vars);return {capital:100,odds:vals.map(Number),pct:5}}
function current(p,m){const key=m.id;if(!state[key])state[key]=getDefaults(m);return state[key]}
function modelView(p,m){const s=current(p,m);const labels=Object.keys(m.vars);const odds=s.odds||Object.values(m.vars);return `<div class="card"><div class="section-title">PARAMÈTRES DU MATCH</div><div class="field"><label>Capital de départ</label><input inputmode="decimal" value="${s.capital}" onchange="setCapital('${m.id}',this.value)"></div><div class="grid" style="margin-top:13px"><div class="field"><label>Pourcentage d'objectif</label><input inputmode="decimal" value="${s.pct}" onchange="setPct('${m.id}',this.value)"></div><div class="field"><label>Objectif</label><input value="${fmt(s.capital*(1+s.pct/100))}" readonly></div></div></div><div class="card"><div class="section-title">CRITÈRES & COTES</div><div class="grid">${labels.map((l,i)=>`<div class="field"><label>${esc(l)}</label><input inputmode="decimal" value="${String(odds[i]).replace('.',',')}" onchange="setOdd('${m.id}',${i},this.value)"></div>`).join('')}</div><button class="primary" onclick="calculate('${p.id}','${m.id}')">Trouver les solutions</button><button class="secondary" onclick="resetCurrent('${m.id}')">Réinitialiser la fenêtre actuelle</button><div id="status-${m.id}" class="status">Appuyez sur « Trouver les solutions » pour lancer le moteur.</div></div><div id="results-${m.id}"></div>`}
function render(){let out=page==='home'?home():pageView(CONFIG.pages.find(x=>x.id===page));app.innerHTML=out;if(page!=='home'){const p=CONFIG.pages.find(x=>x.id===page),m=p.models[activeModel[p.id]??0];document.getElementById('model').innerHTML=modelView(p,m);if(state[m.id]?.last)showResults(m,state[m.id].last)}}
function setModel(pid,i){activeModel[pid]=i;render()}function setCapital(id,v){state[id]??={};state[id].capital=Math.max(4,Number(String(v).replace(',','.'))||100);save();render()}function setPct(id,v){state[id]??={};state[id].pct=Number(String(v).replace(',','.'))||5;save();render()}function setOdd(id,i,v){state[id]??={capital:100,pct:5,odds:[]};state[id].odds??=[];state[id].odds[i]=Math.max(.01,Number(String(v).replace(',','.'))||1);save()}
function resetCurrent(id){delete state[id];save();render()}function resetAll(){localStorage.removeItem('betru-state-v10');Object.keys(state).forEach(k=>delete state[k]);render()}
function calculate(pid,id){const p=CONFIG.pages.find(x=>x.id===pid),m=p.models.find(x=>x.id===id),s=current(p,m);const model=JSON.parse(JSON.stringify(m));const odds=s.odds||Object.values(m.vars);const labels=Object.keys(m.vars); // Rebuild rules using current cotes for standard 2x2 rules; preserve source rule shapes.
 model.rules=model.rules.map(r=>r.replace(/([0-9]+(?:\.[0-9]+)?)([abcd])/g,(_,num,v)=>{const idx='abcd'.indexOf(v);return Number(odds[idx]??num).toFixed(2)+v;}));
 const jid=++job;document.getElementById('status-'+id).innerHTML='<span class="loading">Calcul en cours…</span>';worker.postMessage({type:'solve',id:jid,model,capital:s.capital,pct:s.pct});worker.onmessage=e=>{if(e.data.id!==jid)return;if(e.data.type==='error'){document.getElementById('status-'+id).textContent='Erreur de calcul : '+e.data.error;return}s.last=e.data.data;save();showResults(m,s.last)}}
function showResults(m,r){const el=document.getElementById('results-'+m.id);if(!el)return;const sol5=r.solutions5||[];const ms=r.maxSolutions||[];const maxRows=ms.slice(0,500);const srcRules=m.rules;el.innerHTML=`<div class="card"><div class="metric"><div><div class="section-title">LEVERAGE</div><div class="desc">Pourcentage maximal atteignable avec le capital et les cotes actuels, sous les règles du modèle.</div></div><div class="pill">${pct(r.maxLeverage)}</div></div></div><div class="card"><div class="section-title">RÉSULTATS À +${r.pct}%</div><div class="status">${sol5.length?fmt(sol5.length)+' solution(s) respectant les règles de base.':'Aucune solution ne respecte les règles de base à ce seuil.'}${r.solutions5Truncated?' Affichage limité pour préserver les performances.':''}</div></div><div class="card"><div class="section-title">LIMITES</div><div class="status">Seuil maximal : <b>${fmt(r.maxThreshold)}</b> | Nombre de solutions limites : <b>${ms.length}${ms.length>500?'+':''}</b></div><div class="tablewrap" style="margin-top:10px"><table class="result-table"><thead><tr><th>a</th><th>b</th><th>c</th><th>d</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th></tr></thead><tbody>${maxRows.map(q=>{const vals=evalRules(m,q);return `<tr><td>${q[0]}</td><td>${q[1]}</td><td>${q[2]}</td><td>${q[3]}</td>${vals.map(v=>`<td class="good">${fmt(v)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div><div class="card"><div class="section-title">RÈGLES LIMITES</div><div class="rules"><div class="rule"><b>Objectif limite</b><br>T = Capital × (1 + Leverage / 100) = ${fmt(r.maxThreshold)}</div>${srcRules.filter(x=>/>=/.test(x)).map((x,i)=>`<div class="rule"><b>Règle ${i+1}</b><br>${esc(x.replace(/capital \+ \(capital \* pourcentage\)/,'T'))}</div>`).join('')}<div class="rule"><b>Contrainte de capital</b><br>a,b,c,d ∈ ℕ* ; a + b + c + d ≤ Capital</div></div></div>`}
function evalRules(m,q){const odds=state[m.id]?.odds||Object.values(m.vars);return m.rules.filter(x=>/>=/.test(x)).map(rule=>{let total=0;const re=/([0-9]+(?:\.[0-9]+)?)([abcd])/g;let z;while(z=re.exec(rule)){total+=Number(odds['abcd'.indexOf(z[2])]||z[1])*q['abcd'.indexOf(z[2])]}return total})}
render();setTimeout(()=>document.getElementById('splash').classList.add('hide'),900);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
